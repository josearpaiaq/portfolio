[build]
  command = "npm run build"
  publish = ".next"
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_EMAIL_TO,RESEND_API_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/contact"
  to = "/api/contact"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 3
    window_size = 180
    aggregate_by = ["ip", "domain"]
